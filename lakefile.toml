name = "espal"
version = "0.0.1"
description = "A web framework for Lean 4 whose compiler checks routes, queries and pages"
keywords = ["web", "http", "framework", "dsl", "software-verification"]
license = "Apache-2.0"
defaultTargets = ["Espal"]
testDriver = "tests"
lintDriver = "lint"

[[lean_lib]]
name = "Espal"
leanOptions = { autoImplicit = false, linter.missingDocs = true }

[[lean_lib]]
name = "LintRules"
srcDir = "scripts"
leanOptions = { autoImplicit = false }

[[lean_exe]]
name = "lint"
root = "Lint"
srcDir = "scripts"

[[lean_exe]]
name = "tests"
root = "TestDriver"
srcDir = "scripts"
