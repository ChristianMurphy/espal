global
  nbthread 1
  maxconn 4096

defaults
  mode http
  option http-keep-alive
  http-reuse always
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend spike
  bind 127.0.0.1:18410
  default_backend lean

backend lean
  balance roundrobin
  server s0 127.0.0.1:18401
  server s1 127.0.0.1:18402
