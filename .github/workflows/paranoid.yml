name: Paranoid check

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: paranoid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paranoid:
    name: Replay with every kernel Lean bundles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          auto-config: "false"
          build: "true"

      # Ubuntu 24.04 blocks the unprivileged user namespaces that bubblewrap needs.
      - name: Install bubblewrap for lake check
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Replays the export through Lean's kernel and through leanchecker-paranoid, lean4lean,
      # nanoda, con-leche and con-ron, which `lake check` in `ci.yml` leaves out.
      - name: Replay the export with every bundled checker
        run: lake check --paranoid
