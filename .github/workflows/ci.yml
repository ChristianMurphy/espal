name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build, verify and check style
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds with warnings as errors, runs `lake test` and `lake lint`, and re-checks every
      # declaration with Lean's kernel checker. lean-action's nanoda step expects a `[package]`
      # table and a root module named after the package, which this lakefile does not have, so
      # nanoda runs from `paranoid.yml` instead. Its axiom-audit step audits one module root, and
      # each package has its own, so `lake lint` and `lake check` below check the axioms instead.
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          build-args: "--wfail"
          test: "true"
          lint: "true"
          leanchecker: "true"

      # Compiles generated `api` tables of 10, 50 and 200 routes, and fails when one takes longer
      # than its budget in `scripts/CompileBench.lean`.
      - name: Time the api command on generated tables
        run: lake exe compile-bench

      # Ubuntu 24.04 blocks the unprivileged user namespaces that bubblewrap needs.
      - name: Install bubblewrap for lake check
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Builds and exports Espal in a bubblewrap sandbox, then replays the export through Lean's
      # kernel and fails on any axiom beyond the standard three. `paranoid.yml` adds more kernels.
      - name: Replay the export with lake check
        run: lake check

      - name: Pick the lean-fmt release that matches lean-toolchain
        run: |
          echo "LEAN_FMT_TAG=$(cut -d: -f2 lean-toolchain)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/lean-fmt
          key: lean-fmt-${{ env.LEAN_FMT_TAG }}

      - name: Build lean-fmt
        run: |
          if [ ! -x ~/lean-fmt/.lake/build/bin/lean-fmt ]; then
            git clone --depth 1 --branch "$LEAN_FMT_TAG" https://github.com/jcreinhold/lean-fmt ~/lean-fmt
            (cd ~/lean-fmt && lake build)
          fi

      # The tests compile against their own package in `tests/`, which holds Plausible.
      - name: Check formatting and lean-fmt rules
        run: |
          ~/lean-fmt/.lake/build/bin/lean-fmt format --check $(git ls-files '*.lean' ':!:tests/')
          ~/lean-fmt/.lake/build/bin/lean-fmt check $(git ls-files '*.lean' ':!:tests/')
          cd tests
          lake env ~/lean-fmt/.lake/build/bin/lean-fmt format --check $(git ls-files '*.lean')
          lake env ~/lean-fmt/.lake/build/bin/lean-fmt check $(git ls-files '*.lean')

  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.31.1"
          persona: pedantic
          advanced-security: "false"
