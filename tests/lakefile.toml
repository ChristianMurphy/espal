name = "espal-tests"
defaultTargets = ["EspalTests"]
testDriver = "EspalTests"

[[require]]
name = "espal"
path = ".."

[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible"
rev = "v4.35.0"

[[lean_lib]]
name = "EspalTests"
globs = ["EspalTests.+"]
leanOptions = { warningAsError = true }
