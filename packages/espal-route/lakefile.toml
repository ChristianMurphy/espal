name = "espal-route"
version = "0.0.1"
description = "Typed routes and links for Espal"
license = "Apache-2.0"
defaultTargets = ["EspalRoute"]

[[require]]
name = "espal-core"
path = "../espal-core"

[[require]]
name = "routing"
git = "https://github.com/paulbutcher/lean-routing"
rev = "v0.15.1"

[[lean_lib]]
name = "EspalRoute"
leanOptions = { autoImplicit = false, linter.missingDocs = true }
